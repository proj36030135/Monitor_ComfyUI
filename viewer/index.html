<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Monitor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- date-fns adapter para escalas de tempo -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <!-- Plugin de zoom para Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🖥️ GPU Monitor Dashboard</h1>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">Backend:</span>
                    <span id="backend-status" class="status-value disconnected">Desconectado</span>
                </div>
                <div class="status-item">
                    <span class="status-label">WebSocket:</span>
                    <span id="ws-status" class="status-value disconnected">Desconectado</span>
          </div>
                <div class="status-item">
                    <span class="status-label">GPUs:</span>
                    <span id="gpu-count" class="status-value">-</span>
          </div>
        </div>
        </header>

        <!-- Controles -->
        <section class="card controls">
            <div class="controls-row">
                <div class="control-group">
                    <label for="backend-url">URL do Backend:</label>
                    <input type="text" id="backend-url" value="http://localhost:8000" placeholder="http://localhost:8000">
          </div>
                <div class="control-group">
                    <label for="update-interval">Intervalo (s):</label>
                    <input type="number" id="update-interval" value="2" min="1" max="60">
          </div>
                <div class="control-actions">
                    <button id="connect-btn" class="btn btn-primary">Conectar</button>
                    <button id="disconnect-btn" class="btn btn-secondary" disabled>Desconectar</button>
                    <button id="clear-data-btn" class="btn btn-ghost">Limpar Dados</button>
          </div>
        </div>
        </section>

        <!-- Controles de Sessão -->
        <section class="card session-controls">
            <div class="session-header">
                <h2>📹 Gravação de Sessão</h2>
                <div class="session-status">
                    <span class="status-label">Sessão Ativa:</span>
                    <span id="current-session-name" class="status-value">Nenhuma</span>
                </div>
            </div>
            
            <div class="session-row">
                <div class="session-form">
                    <div class="form-group">
                        <label for="session-name">Nome da Sessão:</label>
                        <input type="text" id="session-name" placeholder="Ex: Treinamento ResNet50" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="session-description">Comentários:</label>
                        <textarea id="session-description" placeholder="Descrição da sessão ou experimento..." rows="2" maxlength="500"></textarea>
                    </div>
                </div>
                <div class="session-actions">
                    <button id="create-session-btn" class="btn btn-primary" disabled>Criar Sessão</button>
                    <button id="start-session-btn" class="btn btn-success" disabled>Iniciar Gravação</button>
                    <button id="stop-session-btn" class="btn btn-danger" disabled>Parar Gravação</button>
                </div>
            </div>
        </section>

        <!-- Cards de GPU em tempo real -->
        <section id="gpu-cards" class="gpu-grid">
            <!-- Cards serão gerados dinamicamente -->
      </section>

        <!-- Gráfico Dinâmico -->
        <section class="card">
            <div class="chart-header">
                <h2>📊 Gráfico Dinâmico</h2>
                <div class="chart-main-controls">
                    <select id="chart-timespan">
                        <option value="300">5 minutos</option>
                        <option value="900">15 minutos</option>
                        <option value="1800" selected>30 minutos</option>
                        <option value="3600">1 hora</option>
                    </select>
                    <button id="pause-charts" class="btn btn-small">⏸️ Pausar</button>
                </div>
            </div>
            
            <div class="chart-config-panel">
                <div class="chart-config-section">
                    <h4>📈 Métricas</h4>
                    <div class="metrics-selector">
                        <label class="metric-checkbox">
                            <input type="checkbox" id="metric-util" value="utilization" checked>
                            <span class="metric-label">Utilização (%)</span>
                            <div class="metric-color" style="background: #2f81f7;"></div>
                        </label>
                        <label class="metric-checkbox">
                            <input type="checkbox" id="metric-temp" value="temperature">
                            <span class="metric-label">Temperatura (°C)</span>
                            <div class="metric-color" style="background: #f0ad4e;"></div>
                        </label>
                        <label class="metric-checkbox">
                            <input type="checkbox" id="metric-memory" value="memory">
                            <span class="metric-label">Memória (MB)</span>
                            <div class="metric-color" style="background: #3ddc97;"></div>
                        </label>
                        <label class="metric-checkbox">
                            <input type="checkbox" id="metric-power" value="power">
                            <span class="metric-label">Potência (W)</span>
                            <div class="metric-color" style="background: #ff6b6b;"></div>
                        </label>
                    </div>
                </div>
                
                <div class="chart-config-section">
                    <h4>🎯 GPUs</h4>
                    <div id="gpu-selector" class="gpu-selector">
                        <!-- GPUs serão adicionadas dinamicamente -->
                    </div>
                </div>
                
                <div class="chart-config-section">
                    <h4>📏 Eixo Y</h4>
                    <div class="y-axis-controls">
                        <label class="axis-option">
                            <input type="radio" name="y-axis-mode" value="auto" checked>
                            <span>Automático</span>
                        </label>
                        <label class="axis-option">
                            <input type="radio" name="y-axis-mode" value="manual">
                            <span>Manual</span>
                        </label>
                        <div class="manual-axis-inputs" style="display: none;">
                            <div class="axis-input-group">
                                <label>Mín:</label>
                                <input type="number" id="y-axis-min" value="0" step="1">
                            </div>
                            <div class="axis-input-group">
                                <label>Máx:</label>
                                <input type="number" id="y-axis-max" value="100" step="1">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="chart-config-section">
                    <h4>💾 Presets</h4>
                    <div class="preset-controls">
                        <select id="preset-selector">
                            <option value="">Selecionar preset...</option>
                        </select>
                        <input type="text" id="preset-name" placeholder="Nome do preset" maxlength="50">
                        <div class="preset-actions">
                            <button id="save-preset" class="btn btn-small btn-primary">Salvar</button>
                            <button id="load-preset" class="btn btn-small btn-secondary">Carregar</button>
                            <button id="delete-preset" class="btn btn-small btn-danger">Deletar</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="chart-container-main">
                <canvas id="main-chart"></canvas>
            </div>
        </section>

        <!-- Histórico e Estatísticas -->
        <section class="card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="history">📈 Histórico</button>
                <button class="tab-btn" data-tab="sessions">📹 Sessões</button>
                <button class="tab-btn" data-tab="stats">📊 Estatísticas</button>
                <button class="tab-btn" data-tab="logs">📝 Logs</button>
            </div>
            
            <div id="history-tab" class="tab-content active">
                <div class="history-controls">
                    <select id="history-period">
                        <option value="1">Última hora</option>
                        <option value="6">Últimas 6 horas</option>
                        <option value="24" selected>Últimas 24 horas</option>
                        <option value="168">Última semana</option>
                    </select>
                    <select id="history-gpu">
                        <option value="">Todas as GPUs</option>
                    </select>
                    <button id="load-history" class="btn btn-primary">Carregar</button>
                </div>
                <div id="history-table" class="table-container">
                    <!-- Tabela será gerada dinamicamente -->
                </div>
            </div>
            
            <div id="sessions-tab" class="tab-content">
                <div class="sessions-controls">
                    <div class="sessions-actions">
                        <button id="refresh-sessions" class="btn btn-primary">🔄 Atualizar</button>
                        <select id="sessions-filter">
                            <option value="all">Todas as Sessões</option>
                            <option value="active">Apenas Ativas</option>
                            <option value="completed">Apenas Finalizadas</option>
                        </select>
                    </div>
                </div>
                <div id="sessions-list" class="sessions-container">
                    <!-- Lista de sessões será gerada dinamicamente -->
                </div>
            </div>
            
            <div id="stats-tab" class="tab-content">
                <div id="stats-content">
                    <!-- Estatísticas serão geradas dinamicamente -->
                </div>
            </div>
            
            <div id="logs-tab" class="tab-content">
                <div class="log-controls">
                    <button id="clear-logs" class="btn btn-ghost">Limpar Logs</button>
                    <button id="export-logs" class="btn btn-secondary">Exportar</button>
                </div>
                <div id="log-container" class="log-container">
                    <!-- Logs serão adicionados aqui -->
                </div>
            </div>
        </section>
    </div>

    <script src="dashboard.js"></script>
  </body>
  </html>
